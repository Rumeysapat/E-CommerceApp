<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Costy-Home Page</title>
    <!-- * Css Link -->
    <link rel="stylesheet" href="./styles/style.css" />

    <!-- * Bootstrap Icons CDN -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <!-- * Header -->
    <header>
      <!-- Container -->
      <div class="container">
        <!-- Menu Icon -->
        <i class="bi bi-list" id="menu-btn"></i>

        <!-- Logo -->
        <a href="/index.html" class="logo"> COSTY </a>

        <!-- Nav -->
        <nav>
          <a href="#">Woman</a>
          <a href="#">Man</a>
          <a href="#">Kids</a>
          <a href="#">Accessories</a>
        </nav>

        <!-- Basket Button -->
        <a href="/cart.html">
          <i class="bi bi-bag-plus-fill" data-quantity="0" id="basket-btn"></i>
        </a>
      </div>
    </header>

    <!-- * Hero Section -->
    <section class="hero">
      <h1>Coloring Styles</h1>
      <div class="container hero-image">
        <img src="./images/hero.png" alt="hero-image" />
      </div>
    </section>

    <!-- * Products  -->
    <section class="products container">
      <!-- Title -->
      <h1>DISCOVER PRODUCT</h1>

    <div class="product-container" id="products-list"></div>


    <!-- * Footer -->
    <footer>
      <!-- Footer Container -->
      <div class="footer-c container">
        <!-- Footer Box-1 -->
        <div class="footer-box">
          <!-- Logo -->
          <h2>COSTY</h2>

          <!-- Social -->
          <div class="social">
            <a href="#"><i class="bi bi-pinterest"></i></a>
            <a href="#"><i class="bi bi-instagram"></i></a>
            <a href="#"><i class="bi bi-facebook"></i></a>
            <a href="#"><i class="bi bi-whatsapp"></i></a>
            <a href="#"><i class="bi bi-youtube"></i></a>
          </div>
        </div>
        <!-- Footer Box-2 -->
        <div class="footer-box">
          <!-- Title -->
          <h3>HELP</h3>

          <!-- List -->
          <ul>
            <li><a href="#">CONTACT US</a></li>
            <li><a href="#">FAQ</a></li>
            <li><a href="#">SHIPMENT</a></li>
            <li><a href="#">PAYMENT</a></li>
            <li><a href="#">RETURN YOUR ORDER</a></li>
            <li><a href="#">TRACK YOUR ORDER</a></li>
          </ul>
        </div>
        <!-- Footer Box-3 -->
        <div class="footer-box">
          <!-- Title -->
          <h3>ABOUT US</h3>

          <!-- List -->
          <ul>
            <li><a href="#"> Our Story</a></li>
            <li><a href="#">Careers</a></li>
            <li><a href="#">Sustainability</a></li>
            <li><a href="#">Store Locator</a></li>
            <li><a href="#">Press</a></li>
            <li><a href="#">Blog</a></li>
          </ul>
        </div>
      </div>

      <!-- Copyright -->
      <p class="copyright">&copy; COSTY STUDİO</p>
    </footer>
    <!-- * Js Connection -->
    <script src="./js/main.js" type="module"></script>
  </body>
</html>
